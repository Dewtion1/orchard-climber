<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f7d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A gravity snake puzzle for the family. Eat apples, grow longer, climb higher.">
<title>Orchard Climber</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --sky:#dfeff5; --sky-deep:#b9d9e8;
  --ink:#213a2a; --ink-soft:#4d6253;
  --cream:#f6f0e4; --cream-sh:#c9bfa9; --white-sh:#d8cfbc;
  --leaf:#4caf50; --leaf-deep:#2f7d3a; --leaf-deep-sh:#1d5426; --leaf-light:#9bd77f; --grass:#a9d98a; --grass-dark:#93cc72;
  --apple:#e0493a; --apple-dark:#a8301f; --splat:#b5301f;
  --gold:#e3a51f; --gold-light:#fbe7a6; --gold-dark:#a8770f; --gold-ink:#5c4307;
  --jade:#2e9e6b; --jade-dark:#1d6e4a;
  --stone:#d6cfc1; --stone-sh:#a69e8e; --stone-ink:#4a4840; --earth:#6f604d; --earth-dark:#3f3427;
  --display:'Lilita One','Arial Black',sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,.screen,canvas{touch-action:manipulation}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;overscroll-behavior:contain}
h1{font-family:var(--display);font-weight:400;margin:0;color:var(--ink);line-height:1;text-wrap:balance;text-align:center}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:var(--ink);text-wrap:balance;text-align:center}
.sub{margin:0;color:var(--ink-soft);text-align:center;font-size:14px;max-width:360px}
button{font-family:var(--body);font-weight:800;font-size:15px;border:0;border-radius:14px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 3px 0 var(--white-sh);padding:0 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .06s,box-shadow .06s;line-height:1.1}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--white-sh)}
button:focus-visible{outline:3px solid var(--apple);outline-offset:2px}
button svg{flex:none}
button.cream{background:var(--cream);box-shadow:0 3px 0 var(--cream-sh)}
button.cream:active{box-shadow:0 1px 0 var(--cream-sh)}
button.go{background:var(--leaf-deep);color:#fff;box-shadow:0 5px 0 var(--leaf-deep-sh);font-family:var(--display);font-weight:400;font-size:26px;border-radius:20px;min-height:64px;width:100%}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-deep-sh)}
button.go small{font-family:var(--body);font-weight:800;font-size:14px;color:#e4f4dc}
button.round{width:44px;height:44px;padding:0;border-radius:22px}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;max-width:520px}
.card{background:var(--cream);border-radius:26px;padding:22px 18px 24px;width:100%;max-width:520px;box-shadow:0 6px 0 var(--cream-sh);display:flex;flex-direction:column;gap:18px}
.bar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .ttl{font-family:var(--display);font-size:28px;line-height:1;text-shadow:0 3px 0 var(--cream)}
.mid{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.mid b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.mid small{font-weight:800;font-size:13px;color:#3b5a45}
.chip{min-height:44px;padding:0 12px;border-radius:22px;background:var(--cream);box-shadow:0 3px 0 var(--cream-sh);display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:18px}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* splash */
#splash{padding:0;overflow:hidden;background:var(--sky);justify-content:flex-start;gap:0;cursor:pointer}
#splash .title{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:4px}
#splash h1{font-size:clamp(52px,17vw,78px);line-height:.92;letter-spacing:.5px;text-shadow:0 4px 0 var(--cream),0 -2px 0 var(--cream),3px 0 0 var(--cream),-3px 0 0 var(--cream)}
#splash .tag{margin-top:12px;font-weight:800;font-size:16px;color:#2f5a3c;letter-spacing:2px;text-transform:uppercase}
#splash .tap{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:200px;height:56px;border-radius:28px;background:var(--cream);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
/* home */
#home{position:absolute;background:var(--sky) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 844' preserveAspectRatio='xMidYMax slice'><path d='M0 700C90 670 170 676 240 694S340 712 390 690V844H0z' fill='%238ccf6c'/><path d='M0 744C80 722 170 730 230 744S330 760 390 740V844H0z' fill='%235aa845'/><path d='M300 92c8-11 27-11 35 0 8-6 22-3 24 8h-64c0-5 1-7 5-8z' fill='%23ffffff'/></svg>") center bottom / cover no-repeat}
.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 8px;width:100%}
.tile{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;box-shadow:none;border-radius:12px;font-weight:800;font-size:14px;line-height:1.1;color:var(--ink)}
.tile:active{transform:none;box-shadow:none}
.tile .ring{position:relative;width:70px;height:70px;border-radius:35px;padding:4px;background:#fff;box-shadow:0 3px 0 var(--white-sh)}
.tile.on .ring{background:var(--gold);box-shadow:0 3px 0 var(--gold-dark)}
.tile .disc{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;color:var(--ink);background:#f2d3b3}
.tile .disc img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tick{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:12px;background:var(--leaf-deep);border:3px solid var(--cream);display:none;align-items:center;justify-content:center}
.tile.on .tick{display:flex}
.tile.add .ring{border:3px dashed #8a9a8c;background:transparent;box-shadow:none;padding:0}
.tile.add .disc{background:transparent;font-size:30px;color:#4d6253}
.tile .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkish{background:none;box-shadow:none;color:var(--ink-soft);font-size:13px;min-height:32px;text-decoration:underline}
.linkish:active{transform:none;box-shadow:none}
input[type=text]{font-family:var(--body);font-weight:800;font-size:16px;padding:10px 12px;border:3px solid var(--white-sh);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
input:focus-visible{outline:3px solid var(--leaf);outline-offset:1px}
.stack{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;padding:0 8px}
/* levels */
#levels{padding:0;gap:0;display:block;background:var(--grass)}
#lvHead{position:sticky;top:0;z-index:3;height:calc(92px + env(safe-area-inset-top,0px));padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;background:linear-gradient(var(--sky) 70%,rgba(223,239,245,0))}
#path{position:relative;width:100%;max-width:520px;margin:-92px auto 0;background:linear-gradient(var(--sky) 0,var(--sky) 140px,var(--grass) 260px)}
#path svg.scene{overflow:visible}
.node{position:absolute;width:80px;margin-left:-40px;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;box-shadow:none;padding:0;border:0;min-height:0;border-radius:0;transform:translateY(-50%)}
.node:active{transform:translateY(-50%)}
.node .disc{position:relative;width:56px;height:56px;border-radius:50%;border:4px solid #e8e2d6;background:var(--stone);color:var(--stone-ink);box-shadow:0 4px 0 var(--stone-sh);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px}
.node.done .disc{background:var(--leaf-deep);color:#fff;border-color:#cfe8c4;box-shadow:0 4px 0 var(--leaf-deep-sh)}
.node.gold .disc{background:var(--gold);color:var(--ink);border-color:var(--gold-light);box-shadow:0 4px 0 var(--gold-dark)}
.node.cur .disc{width:68px;height:68px;background:var(--cream);color:var(--ink);border:5px solid var(--gold);box-shadow:0 4px 0 var(--gold-dark);font-size:30px}
.node:disabled{opacity:1}
.node .badge{position:absolute;right:-6px;top:-8px}
.node .lock{position:absolute;right:-2px;top:-2px;background:#e8e2d6;border-radius:9px;padding:2px}
.node .you{position:absolute;left:50%;top:-34px;margin-left:-18px;width:36px;height:36px;border-radius:18px;background:var(--jade);border:3px solid var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;color:#fff;overflow:hidden;animation:bob 1.8s ease-in-out infinite}
.node .you img{width:100%;height:100%;object-fit:cover}
.node .cap{padding:2px 8px;border-radius:10px;font-weight:800;font-size:12px;white-space:nowrap;background:var(--cream);color:var(--ink)}
.stars{letter-spacing:1px;color:var(--gold-dark);font-size:13px}
.stars i{font-style:normal;opacity:.3}
.node .cap.stars{background:var(--cream)}
.node.gold .cap{background:var(--gold-light)}
.node .who{font-size:11px;font-weight:800;color:#3b5a45;background:rgba(246,240,228,.75);padding:1px 6px;border-radius:8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
#toStart{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));min-height:36px;padding:0 14px;border-radius:18px;font-size:13px;z-index:3}
/* game */
#game{gap:0;overflow:hidden;touch-action:none;overscroll-behavior:none;padding:0;background:var(--earth) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 386'><rect x='18' y='40' width='40' height='22' rx='8' fill='%238f7f69'/><rect x='250' y='20' width='56' height='26' rx='9' fill='%238f7f69'/><rect x='120' y='300' width='48' height='24' rx='9' fill='%238f7f69'/><rect x='310' y='260' width='34' height='20' rx='7' fill='%238f7f69'/><rect x='60' y='200' width='28' height='16' rx='6' fill='%238f7f69'/></svg>") center bottom / 100% auto no-repeat;justify-content:flex-start}
.strip{width:100%;background:var(--cream);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 12px;display:flex;flex-direction:column;gap:10px;flex:none}
.strip .r1{display:flex;align-items:center;gap:10px;min-height:44px}
.strip .name{flex:1 1 auto;min-width:0;font-family:var(--display);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .name small{display:block;font-family:var(--body);font-weight:800;font-size:11px;color:var(--ink-soft);margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.stats{display:flex;gap:4px}
.stats span{width:48px;display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:10px;font-weight:800;font-size:11px;color:var(--ink-soft)}
.stats span.par{background:var(--gold-light);color:var(--gold-ink)}
.stats b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;color:var(--ink)}
.strip .r2{display:flex;gap:8px}
.strip .r2 button{flex:1 1 0;padding:0 6px}
.strip .r2 button.round{flex:0 0 44px}
#acts{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:max(28px,env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:12px}
.act{width:88px;height:88px;border-radius:44px;padding:0;flex-direction:column;gap:2px;color:#fff;font-family:var(--display);font-weight:400;font-size:20px;border:4px solid var(--cream)}
#boomBtn{background:var(--splat);box-shadow:0 5px 0 #7a1f14,0 8px 18px rgba(0,0,0,.25)}
#boomBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a1f14}
#plantBtn{background:var(--leaf-deep);box-shadow:0 5px 0 var(--leaf-deep-sh),0 8px 18px rgba(0,0,0,.25)}
#plantBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-deep-sh)}
.act.nudge{animation:nudge .6s ease-in-out infinite}
#inv{position:absolute;left:8px;top:8px;display:flex;gap:6px;pointer-events:none;z-index:4}
#inv span{display:inline-flex;align-items:center;gap:4px;background:rgba(246,240,228,.94);border-radius:14px;padding:3px 9px 3px 5px;font-family:var(--display);font-size:16px;color:var(--ink);box-shadow:0 2px 0 var(--cream-sh)}
#inv span.honey{background:#fbe7a6}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.strip .r2 .pen{font-size:12px;color:#8a3b10}
#wrap{position:relative;width:100%;flex:none;display:flex;align-items:flex-start;justify-content:center}
#wrap.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
canvas{display:block;width:100%;max-width:100%;touch-action:none;background:var(--sky)}
.tip{margin:14px 24px 0;padding:14px 18px;border-radius:18px;background:var(--cream);box-shadow:0 4px 0 var(--earth-dark);display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;line-height:1.35;width:calc(100% - 48px);max-width:472px}
.pad-hint{position:absolute;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--cream);pointer-events:none;z-index:5;font-weight:800;font-size:15px}
#overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
#overlay.win{background:rgba(24,44,31,.62)}
#overlay.dead{background:rgba(60,22,16,.55)}
#msg{position:relative;width:100%;max-width:342px;background:var(--cream);border-radius:28px;box-shadow:0 8px 0 var(--cream-sh);padding:64px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:40px}
#msg h2{font-size:40px;line-height:1}
#msg h2.red{color:var(--splat);font-size:48px}
#msg .medal{position:absolute;left:50%;top:-52px;margin-left:-52px;width:104px;height:104px;border-radius:52px;background:var(--gold);border:6px solid var(--cream);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--gold-dark)}
#msg .medal.pale{background:#cfe8c4;box-shadow:0 5px 0 #8fb984}
#msg .medal .big{font-size:30px;letter-spacing:1px;color:#5c4307;line-height:1}
#msg .medal .big i{font-style:normal;opacity:.3}
#msg .stamp{position:absolute;right:-10px;top:-10px;width:44px;height:44px;border-radius:22px;background:var(--cream);box-shadow:0 3px 0 var(--cream-sh);display:flex;align-items:center;justify-content:center;transform:rotate(12deg)}
#msg .splat{position:absolute;left:50%;top:-60px;margin-left:-75px}
#msg .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
#msg .tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#msg .tiles div{border-radius:16px;background:#fff;padding:10px 0;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px;color:var(--ink-soft)}
#msg .tiles div.par{background:var(--gold-light);color:var(--gold-ink)}
#msg .tiles b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;color:var(--ink)}
#msg p{margin:0;font-weight:800;font-size:15px;text-align:center;line-height:1.35;text-wrap:pretty}
#msg .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
#msg .two button,#msg button.wide{width:100%;min-height:48px;font-size:16px}
#msg .go small{margin-left:4px}
.confetti{position:absolute;top:-20px;pointer-events:none;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.act.nudge{animation:none;outline:4px solid var(--gold)}.confetti,.tapfx{display:none}.bob,.node .you,#splash .tap{animation:none}#wrap.shake{animation:none}}
.tapfx{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(246,240,228,.3);display:grid;place-items:center;pointer-events:none;z-index:4;animation:tap .35s ease-out forwards}
@keyframes tap{from{transform:scale(.6);opacity:1}to{transform:scale(1.4);opacity:0}}
/* leaderboard */
#board{background:var(--sky)}
.tabs{display:flex;gap:6px;width:100%;max-width:520px}
.tabs button{flex:1;padding:0 6px;font-size:14px}
.tabs button.on{background:var(--leaf-deep);color:#fff;box-shadow:0 3px 0 var(--leaf-deep-sh)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:4px 6px}
td{padding:6px;border-top:2px solid var(--white-sh)}
td.r,th.r{text-align:right}
tr.me td{background:rgba(76,175,80,.15)}
.lbav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;background:var(--leaf-light)}
.rank{font-family:var(--display);color:var(--leaf-deep);width:28px}
select{font-family:var(--body);font-weight:800;font-size:14px;padding:8px;border:3px solid var(--white-sh);border-radius:12px;background:#fff;color:var(--ink);min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){button,.toast{transition:none}}
</style>
</head>

const KEY='orchard.v1';

const LEVELS_V3='2026-10-23T12:00:00Z',LEVELS_V4='2026-10-23T13:00:00Z',LEVELS_V5='2026-10-23T17:00:00Z',LEVELS_V6='2026-10-23T18:16:00Z';
// v3: 19 original levels dropped. v4: old 20-50 became 1-31. v5: the set was reworked and reordered (LEVEL_MAPS.v5: v4 index -> v5 index for the survivors).
// v6: the set grew to 150 and was re-sorted (LEVEL_MAPS.v6: v5 index -> v6 index; every v5 level survived).
function remapRow(x){if(x.updated_at>=LEVELS_V6)return x;let l=x.level;
  if(x.updated_at<LEVELS_V5){if(x.updated_at<LEVELS_V4){if(x.updated_at>=LEVELS_V3&&l>=19)l-=19;else return null;}l=LEVEL_MAPS.v5[l];if(l==null)return null;}
  l=LEVEL_MAPS.v6[l];return l==null?null:{...x,level:l};}
if(!S.v2){for(const p of S.players)for(const k of Object.keys(p.best||{}))if(+k>=5)delete p.best[k];S.v2=true;}
if(!S.v3){for(const p of S.players)for(const k of Object.keys(p.best||{}))if(+k>=19)delete p.best[k];S.v3=true;}
if(!S.v4){for(const p of S.players){const nb={};for(const k of Object.keys(p.best||{}))if(+k>=19)nb[+k-19]=p.best[k];p.best=nb;}S.v4=true;}
if(!S.v5){for(const p of S.players){const nb={};for(const k of Object.keys(p.best||{})){const m=LEVEL_MAPS.v5[k];if(m!=null)nb[m]=p.best[k];}p.best=nb;}S.v5=true;}
if(!S.v6){for(const p of S.players){const nb={};for(const k of Object.keys(p.best||{})){const m=LEVEL_MAPS.v6[k];if(m!=null)nb[m]=p.best[k];}p.best=nb;}S.v6=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const t3=par=>Math.ceil(par*1.2)+2,t2=par=>Math.ceil(par*1.6)+4;
const stars=(best,par)=>best<=t3(par)?3:best<=t2(par)?2:1;
const starStr=n=>'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';

function lbSyncAll(){for(const p of S.players)for(const [l,m] of Object.entries(p.best||{}))lbPush(p,+l,m);}
let LB_CACHE=null,LB_AT=0;
async function lbFetch(force){if(!force&&LB_CACHE&&Date.now()-LB_AT<20000)return LB_CACHE;
  const r=await fetch(LB_URL+'?select=device_id,pid,player,face,level,moves,updated_at&limit=5000',{headers:LB_H});
  if(!r.ok)throw new Error(r.status);const best={};for(const x of (await r.json()).map(remapRow)){if(!x||x.pid.startsWith('pub-')!==PUB||x.level>=LEVELS_MAIN.length)continue;const k=x.device_id+'|'+x.pid+'|'+x.level;if(!best[k]||x.moves<best[k].moves)best[k]=x;}LB_CACHE=Object.values(best);LB_AT=Date.now();return LB_CACHE;}
function lbOverall(rows){const mine=deviceId(),byP={};
  for(const r of rows){const k=r.device_id+'|'+r.pid;const o=byP[k]||(byP[k]={name:r.player,face:r.face,at:'',mine:r.device_id===mine,best:{}});
    if(r.updated_at>o.at){o.at=r.updated_at;o.name=r.player;o.face=r.face;}
    o.best[r.level]=Math.min(o.best[r.level]||1e9,r.moves);}
  return Object.values(byP).map(o=>{const ls=Object.keys(o.best);const under=ls.filter(l=>o.best[l]<=LEVELS_MAIN[l].par).length,st=ls.reduce((a,l)=>a+stars(o.best[l],LEVELS_MAIN[l].par),0);
    return {...o,cleared:ls.length,total:ls.reduce((a,l)=>a+o.best[l],0),under,stars:st};})
    .sort((a,b)=>b.cleared-a.cleared||b.stars-a.stars||b.under-a.under||a.total-b.total);}
function lbBestPerLevel(rows){const out={};for(const r of rows){const o=out[r.level];if(!o||r.moves<o.moves||(r.moves===o.moves&&r.updated_at<o.updated_at))out[r.level]={name:r.player,moves:r.moves,updated_at:r.updated_at};}return out;}

// ---------- rules ----------
// Orchard Climber rules v3. Shared verbatim by the game page (pasted in by build.py) and the node tools.
// Tiles: # rock  A apple  C crate  B bomb  X spikes  E exit  S head  o body  . empty
//   pickups (optional; only red apples are needed to win):
//   K sword   - one cut: swiping into rock while holding a sword cuts that block and the head moves into the gap
//   Q sour    - sour apple: eating it removes a segment (never below two)
//   P seed    - one planting: the Plant move ('P') grows a block in the empty cell in front of the head
//   G golden  - golden apple: grows two segments (one now, one on the next move)
//   H honey   - for six moves the snake clings to rock beside or above it instead of falling
// Detonator levels ({detonator:true}): bombs do not go off when they land. Instead the player has an extra move, the
// detonator (path letter 'B'): every bomb on the board explodes where it sits and the snake does not move.
// A move: head steps one cell (pushing a crate/bomb if one is there), then gravity settles everything.
// Gravity: the snake and every object fall together unless resting on rock or on something resting on rock.
// A bomb that lands after falling explodes: it vanishes, destroys the rock directly beneath it, and kills the snake if a segment is next to it.
// Spikes kill the snake if any segment ends up on them. Objects can sit on spikes and cover them.

    start:{snake,apples,objs,gone:[],items,inv:{k:0,p:0,h:0,g:0},grown:[]}};
}
const K=(x,y)=>x+','+y;

  if(it.length||gr.length||(v&&(v.k||v.p||v.h||v.g)))k+='|'+it.map(p=>p[2]+p[0]+','+p[1]).sort().join(';')+'|'+(v?v.k+','+v.p+','+v.h+','+v.g:'')+'|'+gr.slice().sort().join(';');

function movesFor(lv){const m=DIRS.slice();if(lv.detonator)m.push(DET);if(lv.seeds)m.push(PLANT);return m;}
// BFS. Returns {path, states} or null (unsolvable or over cap).
function solve(lv,cap){cap=cap||400000;
  const seen=new Map([[stateKey(lv.start),null]]);let q=[{st:lv.start,path:''}];
  const M=movesFor(lv);
  while(q.length){const nq=[];for(const n of q){for(const [dx,dy,c] of M){const r=stepState(lv,n.st,dx,dy,c);if(!r||r.dead)continue;
    if(r.win)return {path:n.path+c,states:seen.size};
    const k=stateKey(r.state);if(seen.has(k))continue;seen.set(k,1);if(seen.size>cap)return null;nq.push({st:r.state,path:n.path+c});}}q=nq;}
  return null;}
// Next move on a shortest solution from an arbitrary state (for the in-game hint).
function hintMove(lv,st,cap){cap=cap||150000;
  const seen=new Set([stateKey(st)]);let q=[{st,first:null}];
  const M=movesFor(lv);
  while(q.length){const nq=[];for(const n of q){for(const [dx,dy,c] of M){const r=stepState(lv,n.st,dx,dy,c);if(!r||r.dead)continue;const f=n.first||c;
    if(r.win)return f;const k=stateKey(r.state);if(seen.has(k))continue;seen.add(k);if(seen.size>cap)return null;nq.push({st:r.state,first:f});}}q=nq;}
  return null;}

  const M=movesFor(lv);while(q.length){const nq=[];for(const n of q){for(const [dx,dy,c] of M){const r=stepState(lv,n.st,dx,dy,c);if(!r||r.dead)continue;
    if(r.win)return n.path+c;const k=stateKey(r.state);if(seen.has(k))continue;seen.add(k);if(seen.size>cap)return null;nq.push({st:r.state,path:n.path+c});}}q=nq;}return null;}

    if(q.text){ctx.font="16px 'Lilita One', sans-serif";ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle=`rgba(246,240,228,${k})`;ctx.strokeText(q.text,x,y);ctx.fillStyle=`rgba(181,48,31,${k})`;ctx.fillText(q.text,x,y);}
    else{ctx.fillStyle=q.c;ctx.globalAlpha=k;ctx.beginPath();ctx.arc(x,y,q.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}
  // explosions: starburst grows 0.4→1.2 and fades, with a white flash
  for(const b of booms){const q=(now-b.t0)/450;more=true;if(q<0)continue;
    spr('boom',b.x*CELL,b.y*CELL,.4+q*.8,1-q);
    ctx.fillStyle=`rgba(255,255,255,${(1-q)*.7})`;ctx.beginPath();ctx.arc(b.x*CELL+CELL/2,b.y*CELL+CELL/2,CELL*(.1+q*.5),0,Math.PI*2);ctx.fill();}
  if(bumpT>0){bumpT-=.12;more=true;}
  if(chomp>0){chomp-=.09;more=true;}
  if(landT>0){landT=Math.max(0,landT-.16);more=true;}
  if(parts.length)more=true;
  if(st.objs.some(o=>o.t==='B'))more=true; // fuse flicker
  if(more&&!anim)requestAnimationFrame(()=>{if(!anim&&!$('game').hidden)draw();});}
function fit(){if(!lv)return;const strip=$('game').querySelector('.strip').offsetHeight,avail=innerHeight-strip-(LEVELS[li].tip?90:0);const w=Math.min($('wrap').clientWidth,Math.max(160,avail)*lv.W/lv.H);cv.style.width=w+'px';}
addEventListener('resize',fit);
// input
// swipe anywhere on the game screen: one swipe = one move
let sw=null;
function tapfx(d,x,y){const fx=document.createElement('div');fx.className='tapfx';fx.innerHTML={L:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f6f0e4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',R:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f6f0e4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',U:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f6f0e4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>',D:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f6f0e4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>'}[d];fx.style.left=x+'px';fx.style.top=y+'px';document.body.appendChild(fx);setTimeout(()=>fx.remove(),400);}
$('game').addEventListener('pointerdown',e=>{if(e.target.closest('button,#overlay,.strip'))return;e.preventDefault();sw={x:e.clientX,y:e.clientY,id:e.pointerId};});
$('game').addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;const T=28;
  if(Math.abs(dx)<T&&Math.abs(dy)<T)return;
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U');
  sw=null;$('padHint').hidden=true;tapfx(d,e.clientX,e.clientY);move(d);});
const endSwipe=e=>{if(sw&&e.pointerId===sw.id)sw=null;};
$('game').addEventListener('pointerup',endSwipe);$('game').addEventListener('pointercancel',endSwipe);
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{if($('game').hidden||e.target.tagName==='INPUT')return;const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R',b:'B',B:'B',' ':'B',p:'P',P:'P'}[e.key];
  if(m){if((m==='B'&&$('boomBtn').hidden)||(m==='P'&&$('plantBtn').hidden))return;e.preventDefault();move(m);}else if(e.key==='z'||e.key==='Z')undo();else if(e.key==='r'||e.key==='R')startLevel(li);});
$('undo').onclick=undo;$('reset').onclick=()=>startLevel(li);$('backLv').onclick=()=>{renderLevels();show('levels');};
$('skipBtn').onclick=()=>startLevel(li+1);
$('boomBtn').onclick=()=>move('B');$('plantBtn').onclick=()=>move('P');

// ---------- leaderboard ----------
let boardFrom='home',tab='overall';
function openBoard(){boardFrom=$('levels').hidden?'home':'levels';show('board');const sel=$('lvSel');if(!sel.options.length)LEVELS_MAIN.forEach((L,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${L.name}`;sel.appendChild(o);});renderBoard();}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));renderBoard();});
$('lvSel').onchange=()=>renderBoard();$('refreshLb').onclick=()=>renderBoard(true);
async function renderBoard(force){const body=$('lbBody');$('lvPick').hidden=tab!=='level';body.innerHTML='<p class="sub">Loading…</p>';
  let rows;try{rows=await lbFetch(force);}catch(e){body.innerHTML='<p class="sub">Couldn’t reach the board. Check your connection and tap refresh.</p>';return;}
  const mine=deviceId();
  if(tab==='overall'){const ps=lbOverall(rows);if(!ps.length){body.innerHTML='<p class="sub">Nobody on the board yet. Clear a level!</p>';return;}
    body.innerHTML='<table><tr><th></th><th>Player</th><th class="r">Cleared</th><th class="r">Stars</th><th class="r">Stamps</th><th class="r">Moves</th></tr>'+ps.map((o,i)=>`<tr class="${o.mine?'me':''}"><td class="rank">${i+1}</td><td>${faceSrc(o.face)?`<img class="lbav" alt="" src="${faceSrc(o.face)}">`:''}${esc(o.name)}</td><td class="r">${o.cleared}/${LEVELS_MAIN.length}</td><td class="r">${o.stars}</td><td class="r">${o.under}</td><td class="r">${o.total}</td></tr>`).join('')+'</table>';}
  else{const l=+$('lvSel').value||0;const rs=rows.filter(r=>r.level===l).sort((a,b)=>a.moves-b.moves||a.updated_at.localeCompare(b.updated_at));
    if(!rs.length){body.innerHTML=`<p class="sub">No one has cleared ${esc(LEVELS_MAIN[l].name)} yet. Three stars in ${t3(LEVELS_MAIN[l].par)} moves.</p>`;return;}
    body.innerHTML=`<p class="sub" style="margin-bottom:8px">Three stars in ${t3(LEVELS_MAIN[l].par)} moves, stamp for ${LEVELS_MAIN[l].par}</p><table><tr><th></th><th>Player</th><th class="r">Moves</th></tr>`+rs.map((r,i)=>`<tr class="${r.device_id===mine?'me':''}"><td class="rank">${i+1}</td><td>${faceSrc(r.face)?`<img class="lbav" alt="" src="${faceSrc(r.face)}">`:''}${esc(r.player)}</td><td class="r"><span class="stars">${starStr(stars(r.moves,LEVELS_MAIN[l].par))}</span> ${r.moves}${r.moves<=LEVELS_MAIN[l].par?' '+APPLE_SVG(16,'style="vertical-align:-3px"'):''}</td></tr>`).join('')+'</table>';}}

// ---------- boot ----------
renderPlayers();lbSyncAll();
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});
</script>
